# Apache virtual host for the Zelda timeline at zelda.heimk.es.
# Install to /etc/apache2/sites-available/ and enable with `a2ensite zelda.heimk.es`.
# The HTTPS virtual host (zelda.heimk.es-le-ssl.conf) is generated and managed by certbot.
<VirtualHost *:80>
    ServerName zelda.heimk.es
    DocumentRoot /var/www/zelda-timeline

    <Directory /var/www/zelda-timeline>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/zelda-timeline-error.log
    CustomLog ${APACHE_LOG_DIR}/zelda-timeline-access.log combined

    # Added by certbot: send all HTTP traffic to HTTPS.
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =zelda.heimk.es
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
