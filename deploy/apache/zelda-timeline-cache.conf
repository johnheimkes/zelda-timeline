# Caching headers for the Zelda timeline site (zelda.heimk.es), which is the only site
# served from /var/www/zelda-timeline. Needs mod_headers (a2enmod headers).
# Install to /etc/apache2/conf-available/ and enable with `a2enconf zelda-timeline-cache`.

<Directory /var/www/zelda-timeline>
    # Always re-check the page itself, so a new deploy shows up right away.
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # Icons, preview image and the font change rarely; cache them for a day.
    <FilesMatch "\.(png|jpg|svg|otf)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</Directory>

# Built files have a content hash in their names, so they never change; cache them for a year.
<Directory /var/www/zelda-timeline/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
