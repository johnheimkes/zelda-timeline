# Security headers for the Zelda timeline site (zelda.heimk.es), which is the only site
# served from /var/www/zelda-timeline. Needs mod_headers (a2enmod headers).
# Install to /etc/apache2/conf-available/ and enable with `a2enconf zelda-timeline-security`.
#
# The content policy allows scripts, styles and fonts only from the site itself; both fonts
# are self-hosted. Styles also allow 'unsafe-inline' because Vuetify injects its theme colors
# as an inline <style>. Images allow data: for Vuetify's built-in SVGs.
# HSTS covers subdomains too (zelda.heimk.es has none), and COOP keeps other windows from
# reaching into this page.

<Directory /var/www/zelda-timeline>
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
</Directory>
