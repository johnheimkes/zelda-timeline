# Builds the site and deploys it to zelda.heimk.es on every push to main.
# The DEPLOY_SSH_KEY secret is a dedicated key that the droplet locks to
# /var/www/zelda-timeline with rrsync, so it can only sync files there.
# Also needs the DEPLOY_HOST, DEPLOY_USER and DEPLOY_KNOWN_HOSTS secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job only reads the repository; deploying uses the SSH key, not the GitHub token.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits; Dependabot keeps the pins up to date.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # The server's address, login and pinned host key live in repository secrets
      # so they aren't published in this public repo.
      - name: Upload to droplet
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rltvz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:./"
